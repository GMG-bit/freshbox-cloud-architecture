# FreshBox SpA - Nginx Config (ECS Fargate - Sidecar Pattern)
# En ECS Fargate, los containers del mismo Task comparten red via localhost

server {
    listen 80;
    server_name localhost;

    # Frontend estatico
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso a microservicios (sidecar via localhost)
    location /api/products {
        # GET - Consultar productos
        if ($request_method = GET) {
            proxy_pass http://127.0.0.1:3001;
        }
        # POST - Crear producto
        if ($request_method = POST) {
            proxy_pass http://127.0.0.1:3002;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PUT, DELETE y GET con ID
    location ~ ^/api/products/(\d+)$ {
        # GET - Detalle de producto por ID
        if ($request_method = GET) {
            proxy_pass http://127.0.0.1:3001;
        }
        # PUT - Modificar producto
        if ($request_method = PUT) {
            proxy_pass http://127.0.0.1:3003;
        }
        # DELETE - Eliminar producto
        if ($request_method = DELETE) {
            proxy_pass http://127.0.0.1:3004;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check para ALB
    location /health {
        access_log off;
        return 200 '{"status":"OK","service":"frontend"}';
        add_header Content-Type application/json;
    }
}
