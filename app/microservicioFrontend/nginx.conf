# FreshBox SpA - Nginx Config (Amazon EKS - Microservices ClusterIP Pattern)
# En Kubernetes (EKS), cada microservicio tiene su propio Service ClusterIP con DNS interno

upstream get_products_backend {
    server get-products.freshbox.svc.cluster.local:3001;
    server get-products:3001 backup;
}

upstream create_product_backend {
    server create-product.freshbox.svc.cluster.local:3002;
    server create-product:3002 backup;
}

upstream update_product_backend {
    server update-product.freshbox.svc.cluster.local:3003;
    server update-product:3003 backup;
}

upstream delete_product_backend {
    server delete-product.freshbox.svc.cluster.local:3004;
    server delete-product:3004 backup;
}

server {
    listen 80;
    server_name localhost;

    # Frontend estatico
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso a microservicios (enrutamiento por metodo HTTP)
    location /api/products {
        # GET - Consultar productos
        if ($request_method = GET) {
            proxy_pass http://get_products_backend;
        }
        # POST - Crear producto
        if ($request_method = POST) {
            proxy_pass http://create_product_backend;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # PUT, DELETE y GET con ID
    location ~ ^/api/products/(\d+)$ {
        # GET - Detalle de producto por ID
        if ($request_method = GET) {
            proxy_pass http://get_products_backend;
        }
        # PUT - Modificar producto
        if ($request_method = PUT) {
            proxy_pass http://update_product_backend;
        }
        # DELETE - Eliminar producto
        if ($request_method = DELETE) {
            proxy_pass http://delete_product_backend;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Health check para ALB Ingress y Kubernetes Readiness/Liveness Probe
    location /health {
        access_log off;
        return 200 '{"status":"OK","service":"frontend","orchestrator":"EKS"}';
        add_header Content-Type application/json;
    }
}
