name: Deploy FreshBox ECS Fargate

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build Containers & Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar y sanitizar credenciales de AWS
        run: |
          KEY=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | tr -d '\r\n"' | sed -e 's/.*AWS_ACCESS_KEY_ID=//I' | xargs)
          SECRET=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | tr -d '\r\n"' | sed -e 's/.*AWS_SECRET_ACCESS_KEY=//I' | xargs)
          TOKEN=$(echo -n "${{ secrets.AWS_SESSION_TOKEN }}" | tr -d '\r\n"' | sed -e 's/.*AWS_SESSION_TOKEN=//I' | xargs)

          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"

          echo "AWS_ACCESS_KEY_ID=$KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV

      - name: Validar conexion con AWS
        run: |
          aws sts get-caller-identity

      - name: Iniciar sesion, compilar y subir imagenes Docker a ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="latest"

          # Asegurar que existan los 5 repositorios en ECR
          for repo in frontend get-products create-product update-product delete-product; do
            aws ecr describe-repositories --repository-names "freshbox-$repo" 2>/dev/null || \
            aws ecr create-repository --repository-name "freshbox-$repo"
          done

          # Login a Amazon ECR
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

          # Frontend
          docker build --platform linux/amd64 -t $ECR_REGISTRY/freshbox-frontend:$IMAGE_TAG ./app/microservicioFrontend
          docker push $ECR_REGISTRY/freshbox-frontend:$IMAGE_TAG
          
          # GET Products
          docker build --platform linux/amd64 -t $ECR_REGISTRY/freshbox-get-products:$IMAGE_TAG ./app/microserviciosBackend/get-products
          docker push $ECR_REGISTRY/freshbox-get-products:$IMAGE_TAG
          
          # POST Product
          docker build --platform linux/amd64 -t $ECR_REGISTRY/freshbox-create-product:$IMAGE_TAG ./app/microserviciosBackend/create-product
          docker push $ECR_REGISTRY/freshbox-create-product:$IMAGE_TAG
          
          # PUT Product
          docker build --platform linux/amd64 -t $ECR_REGISTRY/freshbox-update-product:$IMAGE_TAG ./app/microserviciosBackend/update-product
          docker push $ECR_REGISTRY/freshbox-update-product:$IMAGE_TAG
          
          # DELETE Product
          docker build --platform linux/amd64 -t $ECR_REGISTRY/freshbox-delete-product:$IMAGE_TAG ./app/microserviciosBackend/delete-product
          docker push $ECR_REGISTRY/freshbox-delete-product:$IMAGE_TAG

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Asegurar bucket S3 para el estado de Terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="freshbox-tfstate-${ACCOUNT_ID}"
          echo "TF_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Crear bucket si no existe
          aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null || \
          aws s3 mb "s3://${BUCKET_NAME}" --region "$AWS_REGION"
          
          # Habilitar versionamiento (Buenas Practicas de Arquitectura)
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled 2>/dev/null || true

      - name: Inicializar Terraform con backend remoto S3
        run: |
          terraform init \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=freshbox/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Limpiar recursos huerfanos previos
        run: |
          # 1. Eliminar ALB previo si existe para que Terraform lo cree en la VPC correcta
          ALB_ARN=$(aws elbv2 describe-load-balancers --names freshbox-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Eliminando ALB previo..."
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
            aws elbv2 wait load-balancers-deleted --load-balancer-arns "$ALB_ARN" 2>/dev/null || sleep 15
          fi

          # 2. Eliminar Target Group previo si existe
          TG_ARN=$(aws elbv2 describe-target-groups --names freshbox-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            echo "Eliminando Target Group previo..."
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
          fi

          # 3. Eliminar CloudWatch Log Group previo si existe
          aws logs delete-log-group --log-group-name "/ecs/freshbox" 2>/dev/null || true

          # 4. Importar o limpiar Backup Vault si existe
          aws backup delete-backup-vault --backup-vault-name "freshbox-backup-vault" 2>/dev/null || \
          (cd terraform && terraform import aws_backup_vault.main freshbox-backup-vault 2>/dev/null) || true

      - name: Desplegar infraestructura completa con Terraform
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Mostrar URLs y endpoints desplegados
        run: terraform output
        working-directory: ./terraform
