name: Deploy FreshBox EKS & RDS Multi-AZ (EA2)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

jobs:
  deploy:
    name: Build Containers & Deploy Cloud Architecture (EKS + RDS Multi-AZ)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar y sanitizar credenciales de AWS
        run: |
          KEY=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | tr -d '\r\n"' | sed -e 's/.*AWS_ACCESS_KEY_ID=//I' | xargs)
          SECRET=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | tr -d '\r\n"' | sed -e 's/.*AWS_SECRET_ACCESS_KEY=//I' | xargs)
          TOKEN=$(echo -n "${{ secrets.AWS_SESSION_TOKEN }}" | tr -d '\r\n"' | sed -e 's/.*AWS_SESSION_TOKEN=//I' | xargs)

          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"

          echo "AWS_ACCESS_KEY_ID=$KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV

      - name: Validar sesion y conexion con AWS
        run: |
          aws sts get-caller-identity

      - name: Configurar QEMU y Docker Buildx (Soporte ARM64 para Graviton t4g.small)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en ECR, compilar y publicar imagenes Docker
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="latest"

          # Asegurar que existan los 5 repositorios en ECR
          for repo in frontend get-products create-product update-product delete-product; do
            aws ecr describe-repositories --repository-names "freshbox-$repo" 2>/dev/null || \
            aws ecr create-repository --repository-name "freshbox-$repo"
          done

          # Login a Amazon ECR
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

          # Compilar para arquitecturas linux/arm64 y linux/amd64 (compatible con EKS Node Group t4g.small)
          echo "Compilando freshbox-frontend..."
          docker buildx build --platform linux/arm64,linux/amd64 -t $ECR_REGISTRY/freshbox-frontend:$IMAGE_TAG ./app/microservicioFrontend --push

          echo "Compilando freshbox-get-products..."
          docker buildx build --platform linux/arm64,linux/amd64 -t $ECR_REGISTRY/freshbox-get-products:$IMAGE_TAG ./app/microserviciosBackend/get-products --push

          echo "Compilando freshbox-create-product..."
          docker buildx build --platform linux/arm64,linux/amd64 -t $ECR_REGISTRY/freshbox-create-product:$IMAGE_TAG ./app/microserviciosBackend/create-product --push

          echo "Compilando freshbox-update-product..."
          docker buildx build --platform linux/arm64,linux/amd64 -t $ECR_REGISTRY/freshbox-update-product:$IMAGE_TAG ./app/microserviciosBackend/update-product --push

          echo "Compilando freshbox-delete-product..."
          docker buildx build --platform linux/arm64,linux/amd64 -t $ECR_REGISTRY/freshbox-delete-product:$IMAGE_TAG ./app/microserviciosBackend/delete-product --push

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Asegurar bucket S3 para el estado remoto de Terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CUSTOM_BUCKET=$(echo -n "${{ secrets.TF_STATE_BUCKET }}" | tr -d '\r\n" ' | xargs)
          if [ -n "$CUSTOM_BUCKET" ]; then
            BUCKET_NAME="$CUSTOM_BUCKET"
          else
            BUCKET_NAME="freshbox-tfstate-${ACCOUNT_ID}"
          fi
          echo "TF_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Crear bucket si no existe
          aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null || \
          aws s3 mb "s3://${BUCKET_NAME}" --region "$AWS_REGION"
          
          # Habilitar versionamiento (Buenas Practicas de Arquitectura)
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled 2>/dev/null || true

      - name: Inicializar Terraform con backend remoto S3
        run: |
          terraform init \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=freshbox/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"
          
          # Importar repositorios ECR existentes al estado para evitar RepositoryAlreadyExistsException
          for repo in frontend get-products create-product update-product delete-product; do
            terraform import "aws_ecr_repository.repos[\"$repo\"]" "freshbox-$repo" || true
          done
        working-directory: ./terraform

      - name: Desplegar infraestructura base (VPC, SGs, RDS Multi-AZ, EKS) con Terraform
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Configurar kubectl y conectar con Amazon EKS
        run: |
          echo "Configurando acceso kubectl para freshbox-cluster..."
          aws eks update-kubeconfig --region $AWS_REGION --name freshbox-cluster
          kubectl get nodes -o wide

      - name: Esperar disponibilidad de Worker Nodes
        run: |
          echo "Esperando que los worker nodes de EKS esten en estado Ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=300s || true

      - name: Inicializar base de datos y catálogo de productos en Amazon RDS MySQL Multi-AZ
        run: |
          chmod +x ./scripts/init-rds-db.sh
          ./scripts/init-rds-db.sh || true

      - name: Desplegar microservicios y recursos en Kubernetes (EKS)
        run: |
          chmod +x ./scripts/deploy-k8s.sh
          ./scripts/deploy-k8s.sh

      - name: Configurar AWS Load Balancer Controller para Ingress
        run: |
          VPC_ID=$(cd terraform && terraform output -raw vpc_id)
          echo "Instalando AWS Load Balancer Controller en VPC: $VPC_ID..."
          helm repo add eks https://aws.github.io/eks-charts 2>/dev/null || true
          helm repo update 2>/dev/null || true
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=freshbox-cluster \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=$AWS_REGION \
            --set vpcId=$VPC_ID \
            --set image.tag=v2.7.2 || true

      - name: Resumen de Despliegue y URLs de Acceso
        run: |
          echo "=========================================================="
          echo "           RESUMEN FINAL DE DESPLIEGUE EA2               "
          echo "=========================================================="
          cd terraform && terraform output
          echo "=========================================================="
          echo "ESTADO DE NODOS EN EL CLUSTER EKS:"
          kubectl get nodes -o wide
          echo "=========================================================="
          echo "ESTADO DE PODS EN NAMESPACE FRESHBOX:"
          kubectl get pods -n freshbox -o wide
          echo "=========================================================="
          echo "SERVICIOS CLUSTERIP Y LOADBALANCER:"
          kubectl get services -n freshbox -o wide
          echo "=========================================================="
          echo "INGRESS Y HOSTNAME DE BALANCEO:"
          kubectl get ingress -n freshbox -o wide
          echo "=========================================================="
          echo "HORIZONAL POD AUTOSCALER (HPA):"
          kubectl get hpa -n freshbox
          echo "=========================================================="

      - name: Obtener URL Publica y Ejecutar Pruebas CRUD
        run: |
          echo "Esperando que AWS asigne el DNS publico al Load Balancer..."
          for i in {1..25}; do
            LB_HOST=$(kubectl get svc frontend -n freshbox -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -z "$LB_HOST" ]; then
              LB_HOST=$(kubectl get ingress freshbox-ingress -n freshbox -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            fi
            if [ -n "$LB_HOST" ]; then
              echo "=========================================================="
              echo " URL PUBLICA DE FRESHBOX: http://$LB_HOST"
              echo " URL DE PRODUCTOS (RDS):  http://$LB_HOST/api/products"
              echo "=========================================================="
              break
            fi
            echo "Aprovisionando balanceador en AWS... ($i/25)"
            sleep 6
          done

          if [ -n "$LB_HOST" ]; then
            echo "Ejecutando pruebas de verificacion CRUD..."
            chmod +x ./scripts/test-crud.sh
            ./scripts/test-crud.sh || true
          fi

